name: CI

on:
  push:
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

# Новый пуш в ветку или PR отменяет ещё идущий предыдущий запуск того же события.
# На main отмена выключена: там коммитится бейдж покрытия и публикуются GitHub Pages,
# прерывание посреди этих шагов оставило бы полусостояние.
# event_name в группе нужен, чтобы запуски по push и по pull_request не отменяли друг друга.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  extract-vars:
    name: Extract Variables from Taskfile
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.extract.outputs.GO_VERSION }}
      golangci-lint-version: ${{ steps.extract.outputs.GOLANGCI_LINT_VERSION }}
      modules: ${{ steps.extract.outputs.MODULES }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Extract variables from Taskfile
        id: extract
        run: |
          chmod +x .github/scripts/extract-versions.sh
          .github/scripts/extract-versions.sh

  combined-reports:
    needs: extract-vars
    uses: ./.github/workflows/combined-reports.yml
    with:
      modules: ${{ needs.extract-vars.outputs.modules }}
      go-version: ${{ needs.extract-vars.outputs.go-version }}
      golangci-lint-version: ${{ needs.extract-vars.outputs.golangci-lint-version }}

  frontend:
    uses: ./.github/workflows/frontend-reusable.yml

  security:
    needs: extract-vars
    uses: ./.github/workflows/security-reusable.yml
    with:
      modules: ${{ needs.extract-vars.outputs.modules }}
      go-version: ${{ needs.extract-vars.outputs.go-version }}
