name: Frontend Reusable

on:
  workflow_call:

jobs:
  frontend:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🛠 Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 🔄 Install dependencies
        run: npm ci

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: ✅ Lint
        run: npm run lint

      - name: 🧪 Test
        run: npm test

      - name: 🏗 Build
        run: npm run build
