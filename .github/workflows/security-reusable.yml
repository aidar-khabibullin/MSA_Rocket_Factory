name: Security Reusable

on:
  workflow_call:
    inputs:
      modules:
        required: true
        type: string
      go-version:
        required: true
        type: string

jobs:
  govulncheck:
    name: govulncheck (Go-зависимости)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🛠 Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: 🔎 Run govulncheck for every module
        env:
          MODULES: ${{ inputs.modules }}
          # Отчётный режим: на Go 1.24 и текущих версиях grpc/otel/x/net находятся десятки известных уязвимостей.
          # Пока зависимости и Go не обновлены, находки выводятся предупреждениями (warning), а джоб остаётся зелёным.
          # После обновления поставьте "true", чтобы новые уязвимости блокировали merge.
          GOVULNCHECK_STRICT: "false"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          status=0
          for module in $MODULES; do
            echo "::group::govulncheck $module"
            if ! (cd "backend/$module" && "$(go env GOPATH)/bin/govulncheck" ./...); then
              echo "::warning title=govulncheck::В модуле $module найдены уязвимости, подробности в логе"
              status=1
            fi
            echo "::endgroup::"
          done
          if [ "$GOVULNCHECK_STRICT" = "true" ]; then exit $status; fi

  gitleaks:
    name: gitleaks (секреты в истории)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 🔎 Scan for secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: npm audit (зависимости фронтенда)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🛠 Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: 🔎 Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  trivy:
    name: Trivy (конфигурации Dockerfile и compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🔎 Scan IaC misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: HIGH,CRITICAL
          exit-code: "1"
