services: # Envoy — единая точка входа для браузерного фронтенда

  envoy:
    image: envoyproxy/envoy:v1.34.1
    container_name: envoy

    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]

    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      # Дескриптор proto собирает `task proto:descriptor`
      - ./proto.pb:/etc/envoy/proto.pb:ro

    ports:
      - "${ENVOY_HTTP_PORT:-8085}:8080"

    # В образе нет curl/wget, поэтому проверяем admin-порт через bash и /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    restart: unless-stopped

    networks:
      - microservices-net

networks:
  microservices-net:
    external: true
