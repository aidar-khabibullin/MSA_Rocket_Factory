services: # Раздел, описывающий контейнеры, которые требуются для работы Payment-сервиса

  payment-service: # Payment микросервис - обрабатывает платежи и предоставляет gRPC API
    build:
      context: ../../../
      dockerfile: deploy/docker/payment/Dockerfile

    container_name: payment-service

    env_file:
      - .env

    ports:
      - "${GRPC_PORT}:50052"
      - "${HTTP_PORT}:8080"

    healthcheck:
      test: [ "CMD", "/grpc-health-probe", "-addr=127.0.0.1:50052" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - microservices-net

networks:
  microservices-net:
    external: true
