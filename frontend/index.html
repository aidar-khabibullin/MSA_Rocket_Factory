<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Factory</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      // Тема выставляется до первой отрисовки, чтобы не было вспышки не той темы.
      (function () {
        var stored = null
        try {
          // Zustand persist хранит {state: {theme}, version}; старый ключ без версии читаем как запасной.
          var raw = localStorage.getItem('rf:theme:v1')
          stored = raw ? JSON.parse(raw).state.theme : localStorage.getItem('rf.theme')
        } catch (e) {}
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        var root = document.documentElement
        root.classList.add(theme)
        root.setAttribute('data-theme', theme)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
